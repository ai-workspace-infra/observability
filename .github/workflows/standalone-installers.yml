name: Standalone observability installers
on:
  pull_request:
    paths:
      - setup-observability-*.sh
      - scripts/observability_install.py
      - tests/test_standalone_installers.py
      - .github/workflows/standalone-installers.yml
permissions:
  contents: read
jobs:
  installer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'pyyaml==6.0.2'
      - run: bash -n setup-observability-server.sh setup-observability-agent.sh
      - run: python3 -B -m unittest discover -s tests -p test_standalone_installers.py -v
